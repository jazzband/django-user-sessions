[tox]
; Minimum version of Tox
minversion = 1.8
envlist =
    ; https://docs.djangoproject.com/en/5.2/faq/install/#what-python-version-can-i-use-with-django
    py{310,311,312,313}-dj52
    py{312,313}-dj60
    py{312,313}-djmain

[gh-actions]
python =
    3.10: py310
    3.11: py311
    3.12: py312
    3.13: py313

[gh-actions:env]
DJANGO =
    5.2: dj52
    6.0: dj60
    main: djmain

[testenv]
commands =
    make generate-mmdb-fixtures
    coverage run {envbindir}/django-admin test -v 2 --pythonpath=./ --settings=tests.settings
    coverage report
    coverage xml
deps =
    coverage
    dj52: Django>=5.2,<5.3
    dj60: Django>=6.0,<6.1
    djmain: https://github.com/django/django/archive/main.tar.gz
    geoip2
ignore_outcome =
    djmain: True
allowlist_externals = make
